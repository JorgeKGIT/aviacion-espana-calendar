name: Actualizar calendario de aviación

on:
  schedule:
    # Todos los días a las 06:00 UTC
    - cron: "0 6 * * *"

    # Y otra actualización a las 18:00 UTC
    - cron: "0 18 * * *"

  # Permite ejecutarlo manualmente desde GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:

  update-calendar:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Actualizar calendario
        run: |
          python update_calendar.py

      - name: Guardar calendario actualizado
        run: |
          git config user.name "aviacion-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
      
          git add -f docs/aviacion.ics
      
          git commit -m "Actualizar calendario de eventos" || echo "Sin cambios"
      
          git push

      - name: Notificar éxito en Discord
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: success
          title: "✅ Éxito: Calendario actualizado"
          description: "Los eventos de aviación se han actualizado correctamente"

      - name: Notificar error en Discord
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          title: "❌ Error: Falló la actualización"
          description: "Revisar los logs para más detalles"

