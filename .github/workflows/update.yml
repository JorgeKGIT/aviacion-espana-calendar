name: Actualizar calendario de aviación

on:
  schedule:
    # Todos los días a las 06:00 UTC
    - cron: "0 6 * * *"

    # Y otra actualización a las 18:00 UTC
    - cron: "0 18 * * *"

  # Permite ejecutarlo manualmente desde GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:

  update-calendar:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Actualizar calendario
        run: |
          python update_calendar.py

      - name: Comprobar cambios
        id: changes
        run: |
          if git diff --quiet -- docs/aviacion.ics; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Guardar calendario actualizado
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "aviacion-calendar-bot"
          git config user.email "actions@users.noreply.github.com"

          git add docs/aviacion.ics

          git commit -m "Actualizar calendario de eventos"

          git push
